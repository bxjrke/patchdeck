[build-system]
requires = ["setuptools>=69,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "patchdeck"
version = "0.6.0"
description = "A service-oriented homelab update hub"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "mypy>=1.15,<3",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patchdeck = [
  "static/*.css",
  "static/*.js",
  "static/*.png",
  "static/*.svg",
  "static/i18n/*.json",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src/patchdeck"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
